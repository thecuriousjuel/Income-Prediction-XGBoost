[project]
name = "income-prediction-xgboost"
version = "0.1.0"
description = "Income Prediction using XGBoost Algorithm Flask Web App"
requires-python = ">=3.10,<3.11"
dependencies = [
    "flask>=2.0.1,<3.0.0",
    "werkzeug>=2.0.1,<3.0.0",
    "pandas>=1.3.3,<1.4.0",
    "scikit-learn>=1.0,<1.1.0",
    "joblib>=1.0.1",
    "numpy>=1.21.2,<1.23.0",
    "scipy>=1.7.1,<1.8.0",
    "xgboost>=1.4.2,<1.6.0",
    "gunicorn>=20.1.0",
]
